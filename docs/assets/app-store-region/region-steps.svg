<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="590" viewBox="0 0 1120 590" role="img" aria-labelledby="title desc">
  <title id="title">Схема экранов выбора региона App Store</title>
  <desc id="desc">Откройте своё имя в настройках, затем Медиаматериалы и покупки или Контент и покупки, Просмотреть, Страна/регион и выберите Соединённые Штаты.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #173047; }
      .title { font-size: 28px; font-weight: 700; }
      .label { font-size: 22px; font-weight: 650; }
      .body { font-size: 20px; }
      .small { font-size: 17px; fill: #4c6073; }
      .blue { fill: #1458a5; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#4675a8" stroke-width="1.6"/></marker>
  </defs>
  <rect width="1120" height="590" rx="24" fill="#f2f6fb"/>
  <text x="36" y="49" class="title">Выбор страны App Store</text>
  <text x="36" y="79" class="small">Схема экранов · названия и внешний вид зависят от версии системы</text>
  <g transform="translate(36 110)">
    <rect width="320" height="390" rx="22" fill="#fff" stroke="#c6d3e2" stroke-width="2"/>
    <rect x="112" y="12" width="96" height="6" rx="3" fill="#c6d3e2"/>
    <circle cx="28" cy="52" r="15" fill="#1458a5"/><text x="23" y="59" font-size="20" font-weight="700" style="fill:#fff">1</text>
    <text x="53" y="60" class="label">Настройки</text>
    <rect x="16" y="84" width="288" height="61" rx="12" fill="#e9f2ff" stroke="#72a2d5"/>
    <circle cx="46" cy="114" r="16" fill="#bad4f0"/>
    <text x="76" y="122" class="label blue">Ваше имя</text><text x="281" y="121" class="label blue">›</text>
    <path d="M160 156 V178" stroke="#4675a8" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="16" y="192" width="288" height="94" rx="12" fill="#e9f2ff" stroke="#72a2d5"/>
    <text x="30" y="222" class="body blue">Медиаматериалы</text>
    <text x="30" y="248" class="body blue">и покупки</text>
    <text x="30" y="273" class="small">или «Контент и покупки»</text>
    <rect x="16" y="307" width="288" height="55" rx="12" fill="#e9f2ff" stroke="#72a2d5"/>
    <text x="30" y="342" class="label blue">Просмотреть</text><text x="281" y="341" class="label blue">›</text>
  </g>
  <path d="M365 303 H387" stroke="#4675a8" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(400 110)">
    <rect width="320" height="390" rx="22" fill="#fff" stroke="#c6d3e2" stroke-width="2"/>
    <rect x="112" y="12" width="96" height="6" rx="3" fill="#c6d3e2"/>
    <circle cx="28" cy="52" r="15" fill="#1458a5"/><text x="22" y="59" font-size="20" font-weight="700" style="fill:#fff">2</text>
    <text x="53" y="60" class="label">Аккаунт Apple</text>
    <text x="25" y="112" class="body">Способы оплаты</text>
    <path d="M24 133 H296" stroke="#e2e8f0"/>
    <text x="25" y="174" class="body">Подписки</text>
    <path d="M24 195 H296" stroke="#e2e8f0"/>
    <rect x="16" y="219" width="288" height="69" rx="12" fill="#e9f2ff" stroke="#72a2d5"/>
    <text x="30" y="260" class="label blue">Страна/регион</text><text x="281" y="260" class="label blue">›</text>
    <text x="25" y="330" class="small">Если есть кнопка «Изменить</text>
    <text x="25" y="354" class="small">страну или регион», нажмите её.</text>
  </g>
  <path d="M729 303 H751" stroke="#4675a8" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(764 110)">
    <rect width="320" height="390" rx="22" fill="#fff" stroke="#c6d3e2" stroke-width="2"/>
    <rect x="112" y="12" width="96" height="6" rx="3" fill="#c6d3e2"/>
    <circle cx="28" cy="52" r="15" fill="#1458a5"/><text x="22" y="59" font-size="20" font-weight="700" style="fill:#fff">3</text>
    <text x="53" y="60" class="label">Страна/регион</text>
    <text x="25" y="114" class="body">Россия</text>
    <path d="M24 135 H296" stroke="#e2e8f0"/>
    <rect x="16" y="160" width="288" height="76" rx="12" fill="#e9f2ff" stroke="#72a2d5"/>
    <text x="30" y="192" class="label blue">Соединённые</text>
    <text x="30" y="219" class="label blue">Штаты</text>
    <path d="M266 194 l8 8 l14 -18" stroke="#1458a5" stroke-width="3" fill="none"/>
    <rect x="24" y="267" width="272" height="54" rx="12" fill="#1458a5"/>
    <text x="160" y="301" class="label" text-anchor="middle" style="fill:#fff">Продолжить</text>
    <text x="25" y="355" class="small">Затем прочитайте условия</text>
    <text x="25" y="378" class="small">и подтвердите их принятие.</text>
  </g>
  <text x="36" y="546" class="body">Следующий шаг — способ оплаты и адрес для выбранной страны.</text>
</svg>
